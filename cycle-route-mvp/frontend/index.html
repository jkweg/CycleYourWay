<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FC6C26" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cycle Your Way" />
    <meta name="description" content="Planuj trasy rowerowe i nawiguj nimi na telefonie." />
    <title>Cycle Your Way - planer i nawigacja rowerowa</title>
    <style>
      html,
      body {
        margin: 0;
        background: #fff4d6;
      }
      /* Before JS: dark intro background on a first visit, plain vanilla later
         (matches LoadingScreen / TopRouteBar, see src/lib/intro.ts). */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #2a1a12;
      }
      .cyw-returning #boot-splash {
        background: #fff4d6;
      }
    </style>
  </head>
  <body>
    <script>
      try {
        // The Android app plays its launch animation on every start: keep the dark splash.
        var native = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()
        if (!native && localStorage.getItem('cyw:intro-seen') === '1') document.documentElement.classList.add('cyw-returning')
      } catch (e) {
        document.documentElement.classList.add('cyw-returning')
      }
    </script>
    <div id="boot-splash" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
